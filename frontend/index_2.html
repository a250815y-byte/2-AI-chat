<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Companion Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0d0e15;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .phone-container {
            width: 100vw;
            height: 100vh;
            background-color: #161722;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            z-index: 1;
        }
        .screen.active {
            display: flex;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            width: 100%;
        }
        .btn-primary:active { opacity: 0.8; }

        /* --- 1. キャラクター一覧画面 --- */
        #selection-screen {
            padding: 20px;
            overflow-y: auto;
        }
        .screen-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            margin-top: 20px;
        }
        .char-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-bottom: 40px;
        }
        .char-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .char-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }
        .char-card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .char-card h3 { font-size: 18px; margin-bottom: 4px; }
        .char-card p { font-size: 12px; color: rgba(255, 255, 255, 0.5); }

        /* --- 2. ホーム画面 --- */
        .header-bar {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(22, 23, 34, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        @supports (-webkit-touch-callout: none) {
            .header-bar { padding-top: 15px; height: 75px; }
        }
        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .home-avatar-wrap {
            position: relative;
            margin-top: 10px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .home-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6366f1;
        }
        .status-dot {
            width: 16px;
            height: 16px;
            background-color: #22c55e;
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
            right: 8px;
            border: 3px solid #161722;
        }
        .home-name { font-size: 26px; font-weight: bold; margin-bottom: 16px; flex-shrink: 0; }
        .home-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            max-width: 90%;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            white-space: pre-wrap;
        }
        .fixed-input-area {
            padding: 16px;
            background: #161722;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        /* --- 3. チャット画面 --- */
        .chat-main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #11121a;
            -webkit-overflow-scrolling: touch;
        }
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 85%;
            width: 100%;
        }
        .message-row.user { align-self: flex-end; justify-content: flex-end; }
        .message-row.ai { align-self: flex-start; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-all;
        }
        .user .msg-bubble { background-color: #6366f1; color: #fff; border-top-right-radius: 4px; }
        .ai .msg-bubble { background-color: #20222e; color: #fff; border-top-left-radius: 4px; }
        .ai .msg-bubble.loading { padding: 16px; display: flex; gap: 4px; }
        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: dotFlashing 1s infinite linear alternate;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotFlashing { 0% { opacity: 0.2; } 100% { opacity: 1; } }

        .chat-input-area {
            padding: 10px;
            background-color: #161722;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        .chat-input {
            flex: 1;
            background-color: #20222e;
            border: none;
            padding: 14px 18px;
            border-radius: 24px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .send-btn {
            background: #6366f1;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .send-btn:disabled { background: rgba(99, 102, 241, 0.3); color: rgba(255,255,255,0.3); }

        .mic-btn {
            background: #20222e;
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.75);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .mic-btn.listening {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
            animation: micPulse 1.4s infinite;
        }
        .mic-btn:disabled { opacity: 0.4; }
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .voice-status {
            font-size: 12px;
            color: #ef4444;
            text-align: center;
            padding: 4px 10px 0;
            background-color: #161722;
            display: none;
        }
        .voice-status.show { display: block; }

        /* --- 4. 履歴ドロワー --- */
        .history-drawer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background-color: #1c1d2a;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 100;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .history-drawer.open { left: 0; }
        .history-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        @supports (-webkit-touch-callout: none) {
            .history-header { padding-top: 15px; height: 75px; }
        }
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .history-item {
            background: rgba(255,255,255,0.03);
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            border: 1px solid transparent;
        }
        .history-item:active {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .history-item-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-delete-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.45);
            font-size: 16px;
            cursor: pointer;
        }
        .history-delete-btn:active { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .history-delete-btn:disabled { opacity: 0.4; }
        .drawer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 99;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .drawer-overlay.show { display: block; opacity: 1; }

        /* --- 0. ログイン関連画面 --- */
        #login-screen {
            align-items: center;
            justify-content: center;
            padding: 40px 28px;
            text-align: center;
        }
        .login-logo {
            width: 92px;
            height: 92px;
            border-radius: 28px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
        }
        .login-app-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .login-app-sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 48px;
            line-height: 1.6;
        }
        #login-screen .btn-primary {
            max-width: 320px;
        }

        #login-form-screen {
            padding: 20px;
        }
        .login-form-title {
            font-size: 24px;
            font-weight: bold;
            margin: 28px 0 32px;
        }
        .login-form-body {
            flex: 1;
            overflow-y: auto;
        }
        .form-field {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            background-color: #20222e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 16px;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .form-input:focus {
            border-color: #6366f1;
        }
        .form-error {
            font-size: 13px;
            color: #ef4444;
            margin: -6px 0 16px;
            display: none;
        }
        .form-error.show {
            display: block;
        }
        .login-submit-area {
            padding: 16px 0;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        .login-btn-group {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-secondary:active { background: rgba(255, 255, 255, 0.06); }
        .form-success {
            font-size: 13px;
            color: #22c55e;
            margin: -6px 0 16px;
            display: none;
        }
        .form-success.show { display: block; }

        /* --- ログアウト --- */
        .selection-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.75);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .logout-btn:active { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; }
        .drawer-footer {
            padding: 14px 20px;
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .drawer-footer .logout-btn { width: 100%; padding: 12px; border-radius: 14px; }
    </style>
</head>
<body>

    <div class="phone-container">

        <div class="drawer-overlay" id="drawer-overlay" onclick="toggleHistory(false)"></div>
        <div class="history-drawer" id="history-drawer">
            <div class="history-header">
                <h3>会話の履歴</h3>
                <button class="icon-btn" onclick="toggleHistory(false)">✕</button>
            </div>
            <div class="history-list" id="history-list-area"></div>
            <div class="drawer-footer">
                <button class="logout-btn" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="screen active" id="login-screen">
            <div class="login-logo">💬</div>
            <div class="login-app-title">AI Companion</div>
            <div class="login-app-sub">いつでもそばにいる、あなたの話し相手。<br>ログインしてはじめよう。</div>
            <div class="login-btn-group">
                <button class="btn-primary" onclick="goToLoginForm()">ログイン</button>
                <button class="btn-secondary" onclick="goToRegisterForm()">IDをお持ちでない方はこちら（新規登録）</button>
            </div>
        </div>

        <div class="screen" id="login-form-screen">
            <div class="header-bar">
                <button class="icon-btn" onclick="goBackToLogin()">←</button>
                <span style="font-weight: bold;">ログイン</span>
                <span style="width: 44px;"></span>
            </div>
            <div class="login-form-body">
                <form id="login-form" onsubmit="attemptLogin(event)" style="padding: 0 20px;">
                    <div class="login-form-title">アカウント情報を入力</div>

                    <div class="form-success" id="login-success"></div>

                    <div class="form-field">
                        <label class="form-label" for="login-email">メールアドレス</label>
                        <input type="email" id="login-email" class="form-input" placeholder="you@example.com" autocomplete="username">
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="login-password">パスワード</label>
                        <input type="password" id="login-password" class="form-input" placeholder="パスワード" autocomplete="current-password">
                    </div>

                    <div class="form-error" id="login-error"></div>
                </form>
            </div>
            <div class="login-submit-area" style="padding-left:20px; padding-right:20px;">
                <button type="submit" form="login-form" class="btn-primary" id="login-submit-btn">ログイン</button>
            </div>
        </div>

        <div class="screen" id="register-form-screen">
            <div class="header-bar">
                <button class="icon-btn" onclick="goBackToLogin()">←</button>
                <span style="font-weight: bold;">新規登録</span>
                <span style="width: 44px;"></span>
            </div>
            <div class="login-form-body">
                <form id="register-form" onsubmit="attemptRegister(event)" style="padding: 0 20px;">
                    <div class="login-form-title">アカウントを作成</div>

                    <div class="form-field">
                        <label class="form-label" for="register-username">ユーザー名</label>
                        <input type="text" id="register-username" class="form-input" placeholder="表示名" autocomplete="nickname">
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="register-email">メールアドレス</label>
                        <input type="email" id="register-email" class="form-input" placeholder="you@example.com" autocomplete="email">
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="register-password">パスワード</label>
                        <input type="password" id="register-password" class="form-input" placeholder="パスワード" autocomplete="new-password">
                    </div>

                    <div class="form-error" id="register-error"></div>
                </form>
            </div>
            <div class="login-submit-area" style="padding-left:20px; padding-right:20px;">
                <button type="submit" form="register-form" class="btn-primary" id="register-submit-btn">登録する</button>
            </div>
        </div>

        <div class="screen" id="selection-screen">
            <div class="selection-top-row">
                <div class="screen-title">キャラクター</div>
                <button class="logout-btn" onclick="logout()">ログアウト</button>
            </div>
            <div class="char-grid">
                <div class="char-card" onclick="selectCharacter('つむぎ', 'images tsumugi.jpg')">
                    <img src="images tsumugi.jpg" alt="つむぎ">
                    <h3>つむぎ</h3>
                    <p>津軽弁 / 21歳</p>
                </div>
                <div class="char-card" onclick="selectCharacter('蒼空', 'images aozora.jpg')">
                    <img src="images aozora.jpg" alt="蒼空">
                    <h3>そら</h3>
                    <p>津軽弁 / 21歳</p>
                </div>
            </div>
        </div>

        <div class="screen" id="home-screen">
            <div class="header-bar">
                <button class="icon-btn" onclick="toggleHistory(true)">☰</button>
                <span style="font-weight: bold;">AI Companion</span>
                <button class="icon-btn" onclick="goBackToSelection()">↩</button>
            </div>
            <div class="home-main">
                <div class="home-avatar-wrap">
                    <img id="home-avatar-img" src="" alt="avatar" class="home-avatar">
                    <div class="status-dot"></div>
                </div>
                <div class="home-name" id="home-character-name">キャラクター名</div>
                <div class="home-desc" id="home-character-desc">紹介文がここに入ります。</div>
            </div>
            <div class="fixed-input-area">
                <button class="btn-primary" onclick="startChat()" id="start-chat-btn">トークを始める</button>
            </div>
        </div>

        <div class="screen" id="chat-screen">
            <div class="header-bar">
                <button class="icon-btn" onclick="goBackToHome()">←</button>
                <span id="chat-header-name" style="font-weight: bold;">キャラクター名</span>
                <button class="icon-btn" style="font-size: 18px;">📞</button>
            </div>
            <div class="chat-main" id="chat-messages"></div>
            <div class="voice-status" id="voice-status">🎤 聞き取り中... もう一度タップで停止</div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chat-input-field" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
                <button class="mic-btn" onclick="toggleVoiceInput()" id="mic-btn" aria-label="音声入力">🎤</button>
                <button class="send-btn" onclick="sendMessage()" id="send-msg-btn">➔</button>
            </div>
        </div>

    </div>

    <script>
        // フロントとバックエンドを同じマシンで動かす場合は localhost を使用し、
        // 別ホストに配置した場合はフロントと同じホスト名の 3000 番ポートを使用する。
        const API_BASE_URL = window.location.protocol === 'file:'
            ? 'http://localhost:3000'
            : `${window.location.protocol}//${window.location.hostname}:3000`;

        /* ログイン成功時にサーバーから返る userId で上書きされる（未ログイン時は null） */
        let CURRENT_USER_ID = null;
        let ACCESS_TOKEN = null;

        /* ログインを使うかどうか。
           false : ログイン画面を飛ばして、キャラクター選択画面から開始（固定ユーザーIDを使用）
           true  : ログイン／新規登録画面から開始（ログイン成功時の userId を使用） */
        const USE_LOGIN = true;
        const GUEST_USER_ID = "79596575-e7b0-41e8-860a-f8d5bf0162c8";

        let currentCharacter = { name: '', image: '' };
        let activeConversations = { "つむぎ": null, "蒼空": null };

        const characters = {
            tsumugi: { name: 'つむぎ', image: 'images tsumugi.jpg' },
            aozora: { name: '蒼空', image: 'images aozora.jpg' }
        };

        function characterIdFromName(name) {
            if (name === 'つむぎ' || name === 'tsumugi') return 'tsumugi';
            if (name === '蒼空' || name === 'aozora' || name === 'そら') return 'aozora';
            return 'tsumugi';
        }

        const characterDescriptions = {
            "つむぎ": "誰とでもすぐ打ち解ける、人懐っこくて笑顔が絶えない女の子。\n\n困っている人を見ると放っておけず、見返りなんて考えず自然と手を差し伸べる優しさを持っている。\n明るく場を盛り上げるムードメーカーだが、ただのお調子者ではない。\n\n現実をしっかり見据え、自分が決めたことは最後までやり抜く芯の強さと覚悟を秘めている。\n普段は津軽弁で気さくに話し、初対面でも距離を縮めるのが得意。\n\nその温かな笑顔とまっすぐな人柄は、多くの人から信頼されている。",
            "蒼空": "人懐っこく、誰とでも気軽に話せる明るい青年。\n\n持ち前の笑顔と気さくな津軽弁で自然と人の輪に溶け込み、初対面の相手でも緊張させない空気を作る。\n困っている人を見れば放っておけず、見返りを求めることなく手を差し伸べるのが当たり前。\n\n周囲への気配りも細やかで、自分より相手を優先して行動することも少なくない。\nその穏やかな人柄とは裏腹に、現実をしっかり受け止める冷静さと、自分が信じた道を最後まで貫く強い覚悟を持つ。\n\n明るさと優しさ、そして揺るがない芯を兼ね備えた、誰からも信頼される青年。"
        };

        function switchScreen(screenId) {
            stopVoiceInput();
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        /* --- ログイン・新規登録 --- */
        function goToLoginForm() {
            document.getElementById('login-error').classList.remove('show');
            document.getElementById('login-success').classList.remove('show');
            switchScreen('login-form-screen');
        }

        function goToRegisterForm() {
            document.getElementById('register-error').classList.remove('show');
            switchScreen('register-form-screen');
        }

        function goBackToLogin() {
            switchScreen('login-screen');
        }

        async function attemptLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorEl = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-submit-btn');
            errorEl.classList.remove('show');

            if (!email || !password) {
                errorEl.innerText = "メールアドレスとパスワードを入力してください。";
                errorEl.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "ログイン中...";

            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.innerText = data.error || data.message || "ログインに失敗しました。メールアドレスとパスワードをご確認ください。";
                    errorEl.classList.add('show');
                    return;
                }

                // サーバーから返る userId を今後の会話・メッセージAPI呼び出しに使う
                CURRENT_USER_ID = data.userId;
                ACCESS_TOKEN = data.accessToken;

                document.getElementById('login-form').reset();
                switchScreen('selection-screen');
            } catch (error) {
                console.error("ログイン通信に失敗しました:", error);
                errorEl.innerText = "サーバーに接続できませんでした。時間をおいて再度お試しください。";
                errorEl.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "ログイン";
            }
        }

        async function attemptRegister(event) {
            event.preventDefault();
            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const errorEl = document.getElementById('register-error');
            const submitBtn = document.getElementById('register-submit-btn');
            errorEl.classList.remove('show');

            if (!username || !email || !password) {
                errorEl.innerText = "ユーザー名・メールアドレス・パスワードをすべて入力してください。";
                errorEl.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "登録中...";

            try {
                const res = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.innerText = data.error || data.message || "登録に失敗しました。入力内容をご確認ください。";
                    errorEl.classList.add('show');
                    return;
                }

                // 新規登録APIはアクセストークンを返さないため、そのままログイン画面に誘導する
                document.getElementById('register-form').reset();
                document.getElementById('login-email').value = email;
                const successEl = document.getElementById('login-success');
                successEl.innerText = data.message || "登録が完了しました。ログインしてください。";
                successEl.classList.add('show');
                document.getElementById('login-error').classList.remove('show');
                switchScreen('login-form-screen');
            } catch (error) {
                console.error("新規登録の通信に失敗しました:", error);
                errorEl.innerText = "サーバーに接続できませんでした。時間をおいて再度お試しください。";
                errorEl.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "登録する";
            }
        }

        function selectCharacter(name, imagePath) {
            currentCharacter.name = name;
            currentCharacter.image = imagePath;
            document.getElementById('home-character-name').innerText = name;
            document.getElementById('home-avatar-img').src = imagePath;
            const descText = characterDescriptions[name] || "紹介文は現在準備中です。";
            document.getElementById('home-character-desc').innerText = descText;
            switchScreen('home-screen');
        }

        async function startChat() {
            document.getElementById('chat-header-name').innerText = currentCharacter.name;
            const chatMain = document.getElementById('chat-messages');
            chatMain.innerHTML = '';

            const startBtn = document.getElementById('start-chat-btn');
            startBtn.disabled = true;
            startBtn.innerText = "接続中...";

            let conversationId = activeConversations[currentCharacter.name];

            if (!conversationId) {
                try {
                    const response = await fetch(`${API_BASE_URL}/conversations`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: CURRENT_USER_ID, title: currentCharacter.name, characterName: characterIdFromName(currentCharacter.name) })
                    });
                    const data = await response.json();

                    if (data && data.id) {
                        conversationId = data.id;
                        activeConversations[currentCharacter.name] = conversationId;
                    }
                } catch (error) {
                    console.error("会話の取得に失敗しました:", error);
                    renderMessageElement("サーバーへの接続に失敗しました。", "ai");
                    startBtn.disabled = false;
                    startBtn.innerText = "トークを始める";
                    switchScreen('chat-screen');
                    return;
                }
            }

            startBtn.disabled = false;
            startBtn.innerText = "トークを始める";

            if (conversationId) {
                try {
                    const response = await fetch(`${API_BASE_URL}/messages/${conversationId}`);
                    const messages = await response.json();

                    if (messages && messages.length > 0) {
                        messages.forEach(msg => {
                            renderMessageElement(msg.content, msg.sender);
                        });
                        scrollChatToBottom();
                    } else {
                        renderMessageElement(`こんにちは！${currentCharacter.name}だじゃ。よろしくの！✨`, 'ai');
                    }
                } catch (error) {
                    console.error("メッセージ一覧の取得に失敗しました:", error);
                    renderMessageElement("履歴の取得に失敗しました。", "ai");
                }
            }

            switchScreen('chat-screen');
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if (!text) return;

            const conversationId = activeConversations[currentCharacter.name];
            if (!conversationId) return;

            const sendBtn = document.getElementById('send-msg-btn');
            stopVoiceInput();

            renderMessageElement(text, 'user');
            input.value = '';
            sendBtn.disabled = true;
            input.disabled = true;
            scrollChatToBottom();

            const loadingBubble = addLoadingBubble();

            try {
                const aiResponse = await fetch(`${API_BASE_URL}/ai`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversationId: conversationId,
                        userMessage: text,
                        characterName: currentCharacter.name === 'つむぎ' ? 'tsumugi' : 'aozora'
                    })
                });

                removeLoadingBubble(loadingBubble);

                if (!aiResponse.ok) throw new Error("AIサーバーエラー");

                const aiData = await aiResponse.json();
                renderMessageElement(aiData.reply, 'ai');

            } catch (error) {
                console.error("通信エラーが発生しました:", error);
                removeLoadingBubble(loadingBubble);
                renderMessageElement("ごめん、うまく聞き取れんかったじゃ…", 'ai');
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
                scrollChatToBottom();
            }
        }

        async function toggleHistory(open) {
            const drawer = document.getElementById('history-drawer');
            const overlay = document.getElementById('drawer-overlay');
            const listArea = document.getElementById('history-list-area');

            if (open) {
                drawer.classList.add('open');
                overlay.classList.add('show');
                listArea.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5);font-size:14px;">読み込み中...</p>';

                try {
                    const response = await fetch(`${API_BASE_URL}/conversations/${CURRENT_USER_ID}`);
                    const conversations = await response.json();
                    listArea.innerHTML = '';

                    if (conversations && conversations.length > 0) {
                        conversations.forEach(conv => {
                            const item = document.createElement('div');
                            item.classList.add('history-item');
                            const titleSpan = document.createElement('span');
                            titleSpan.classList.add('history-item-title');
                            titleSpan.innerText = `${conv.title} との会話`;
                            item.appendChild(titleSpan);

                            const deleteBtn = document.createElement('button');
                            deleteBtn.classList.add('history-delete-btn');
                            deleteBtn.innerText = '🗑';
                            deleteBtn.setAttribute('aria-label', '会話を削除');
                            deleteBtn.onclick = (e) => {
                                e.stopPropagation();
                                deleteConversation(conv, item, deleteBtn);
                            };
                            item.appendChild(deleteBtn);

                            item.onclick = () => {
                                toggleHistory(false);
                                const character = characters[characterIdFromName(conv.character_name || conv.title)];
                                selectCharacter(character.name, character.image);
                                activeConversations[character.name] = conv.id;
                                startChat();
                            };
                            listArea.appendChild(item);
                        });
                    } else {
                        listArea.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5);font-size:14px;">まだ履歴はありません。</p>';
                    }
                } catch (error) {
                    console.error("会話一覧の取得に失敗しました:", error);
                    listArea.innerHTML = '<p style="text-align:center;color:#ef4444;font-size:14px;">履歴の取得に失敗しました。</p>';
                }
            } else {
                drawer.classList.remove('open');
                overlay.classList.remove('show');
            }
        }

        async function deleteConversation(conv, itemEl, deleteBtn) {
            if (!confirm(`${conv.title} との会話を削除しますか？\nこの操作は取り消せません。`)) return;

            deleteBtn.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/conversations/${conv.id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || "削除に失敗しました。");
                    deleteBtn.disabled = false;
                    return;
                }

                // 削除した会話が現在使用中なら、次回は新しい会話を作るようにリセット
                const charName = characters[characterIdFromName(conv.character_name || conv.title)].name;
                const wasActive = activeConversations[charName] === conv.id;
                if (wasActive) {
                    activeConversations[charName] = null;
                }

                itemEl.remove();

                const listArea = document.getElementById('history-list-area');
                if (!listArea.querySelector('.history-item')) {
                    listArea.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5);font-size:14px;">まだ履歴はありません。</p>';
                }

                // 表示中のチャットが削除された会話だった場合はホーム画面に戻す
                if (wasActive && document.getElementById('chat-screen').classList.contains('active')) {
                    toggleHistory(false);
                    document.getElementById('chat-messages').innerHTML = '';
                    switchScreen('home-screen');
                }
            } catch (error) {
                console.error("会話の削除に失敗しました:", error);
                alert("サーバーに接続できませんでした。時間をおいて再度お試しください。");
                deleteBtn.disabled = false;
            }
        }

        /* --- 音声入力（Web Speech API：リアルタイムで文字起こし） --- */
        const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;
        let voiceBaseText = '';

        function setVoiceUI(listening, message) {
            const micBtn = document.getElementById('mic-btn');
            const status = document.getElementById('voice-status');
            if (!micBtn || !status) return;
            micBtn.classList.toggle('listening', listening);
            status.innerText = message || '🎤 聞き取り中... もう一度タップで停止';
            status.classList.toggle('show', listening || !!message);
        }

        function toggleVoiceInput() {
            if (!SpeechRecognitionClass) {
                alert("このブラウザは音声入力に対応していません。Chrome または Safari をご利用ください。");
                return;
            }
            if (isListening) { stopVoiceInput(); } else { startVoiceInput(); }
        }

        function startVoiceInput() {
            const input = document.getElementById('chat-input-field');
            voiceBaseText = input.value;

            recognition = new SpeechRecognitionClass();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;   // 認識途中の文字もリアルタイム表示
            recognition.continuous = true;       // 話し終わっても止まらず続ける

            recognition.onstart = () => {
                isListening = true;
                setVoiceUI(true);
            };

            recognition.onresult = (event) => {
                let finalText = '';
                let interimText = '';
                for (let i = 0; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) finalText += transcript;
                    else interimText += transcript;
                }
                input.value = voiceBaseText + finalText + interimText;
            };

            recognition.onerror = (event) => {
                console.error("音声認識エラー:", event.error);
                let msg = '';
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    msg = "マイクの使用が許可されていません。ブラウザの設定をご確認ください。";
                } else if (event.error === 'no-speech') {
                    msg = "音声が聞き取れませんでした。";
                } else if (event.error === 'network') {
                    msg = "音声認識のネットワークエラーです。";
                } else if (event.error === 'audio-capture') {
                    msg = "マイクが見つかりません。";
                }
                isListening = false;
                setVoiceUI(false, msg);
                if (msg) setTimeout(() => setVoiceUI(false), 3000);
            };

            recognition.onend = () => {
                isListening = false;
                const status = document.getElementById('voice-status');
                if (status && status.innerText.indexOf('聞き取り中') !== -1) setVoiceUI(false);
                document.getElementById('mic-btn').classList.remove('listening');
            };

            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }

        function stopVoiceInput() {
            if (recognition && isListening) {
                recognition.stop();
            }
            isListening = false;
            const micBtn = document.getElementById('mic-btn');
            if (micBtn) setVoiceUI(false);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function renderMessageElement(content, sender) {
            const chatMain = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.classList.add('message-row', sender);

            if (sender === 'ai') {
                const img = document.createElement('img');
                img.classList.add('msg-avatar');
                img.src = currentCharacter.image;
                img.onerror = () => img.src = "https://via.placeholder.com/36/161722/FFFFFF?text=AI";
                row.appendChild(img);
            }

            const bubble = document.createElement('div');
            bubble.classList.add('msg-bubble');
            bubble.innerText = content;
            row.appendChild(bubble);

            chatMain.appendChild(row);
        }

        function addLoadingBubble() {
            const chatMain = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.classList.add('message-row', 'ai');

            const img = document.createElement('img');
            img.classList.add('msg-avatar');
            img.src = currentCharacter.image;
            row.appendChild(img);

            const bubble = document.createElement('div');
            bubble.classList.add('msg-bubble', 'loading');
            bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            row.appendChild(bubble);

            chatMain.appendChild(row);
            scrollChatToBottom();
            return row;
        }

        function removeLoadingBubble(loadingRow) {
            if (loadingRow && loadingRow.parentNode) {
                loadingRow.parentNode.removeChild(loadingRow);
            }
        }

        function scrollChatToBottom() {
            const chatMain = document.getElementById('chat-messages');
            chatMain.scrollTop = chatMain.scrollHeight;
        }

        // ログインなしモード：固定ユーザーIDでキャラクター選択画面から開始
        if (!USE_LOGIN) {
            CURRENT_USER_ID = GUEST_USER_ID;
            switchScreen('selection-screen');
        }

        /* --- ログアウト --- */

        async function callLogoutApi() {
            const response = await fetch(`${API_BASE_URL}/auth/logout`, { method: 'POST' });
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || 'ログアウトAPIが失敗しました');
            }
        }

        async function logout() {
            if (!confirm("ログアウトしますか？")) return;

            // バックエンドの /auth/logout を呼び出す
            try {
                await callLogoutApi();
            } catch (error) {
                console.error("ログアウトAPIの呼び出しに失敗しました:", error);
                // 失敗しても、この端末上のログアウトは続行する
            }

            // 音声入力・履歴ドロワーを閉じる
            stopVoiceInput();
            toggleHistory(false);

            // ログイン情報と会話の状態をすべてリセット
            CURRENT_USER_ID = null;
            ACCESS_TOKEN = null;
            currentCharacter = { name: '', image: '' };
            activeConversations = { "つむぎ": null, "蒼空": null };

            // 画面に残っている内容を消去（次のユーザーに前の会話が見えないように）
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('history-list-area').innerHTML = '';
            document.getElementById('chat-input-field').value = '';
            document.getElementById('login-form').reset();
            document.getElementById('register-form').reset();
            document.getElementById('login-error').classList.remove('show');
            document.getElementById('login-success').classList.remove('show');
            document.getElementById('register-error').classList.remove('show');

            switchScreen('login-screen');
        }

        function goBackToSelection() { switchScreen('selection-screen'); }
        function goBackToHome() { switchScreen('home-screen'); }
    </script>
